name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, Typecheck, Unit-Tests, Playwright
    runs-on: ubuntu-latest
    # ohne Limit läuft ein hängender Job bis zu 6 Stunden
    timeout-minutes: 25
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U app -d app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Version aus "packageManager" in package.json
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint (Biome und check:tokens)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit-Tests
        run: bun test
      - name: Build der Oberfläche
        run: bun run build
      # Abhängigkeiten kommen über apt: hängt die Paketquelle, nach 4 Minuten abbrechen und bis zu dreimal neu versuchen
      - name: Playwright-Browser installieren (Chromium)
        timeout-minutes: 14
        run: |
          for i in 1 2 3; do
            timeout 240 bunx playwright install --with-deps chromium && exit 0
            echo "Versuch $i hing oder schlug fehl, neuer Versuch"
          done
          exit 1
      - name: Passwörter der Test-Konten erzeugen
        # Zufällig je Lauf, damit kein Passwort im Repo steht. Die Datenbank ist nach dem Lauf weg.
        run: |
          for name in SEED_ADMIN_PASSWORD SEED_USER_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Playwright (gebaute App, Seed, Chromium)
        run: bun run test:e2e
      - name: Playwright-Bericht und Traces hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  docker:
    name: Docker-Image und Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # compose.yaml hat keinen Standardwert für APP_URL, ohne ihn startet der Dienst "app" nicht.
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - name: Admin-Zugang erzeugen
        # Zufällig je Lauf und maskiert, wie die Seed-Passwörter im Job "check". compose.yaml
        # reicht ADMIN_EMAIL und ADMIN_PASSWORD an den Dienst "app" weiter.
        run: |
          email="ci-admin-$(openssl rand -hex 6)@example.test"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$email"
          echo "::add-mask::$password"
          echo "ADMIN_EMAIL=$email" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Image bauen
        run: docker build -t app:ci .
      - name: Image läuft nicht als root
        run: |
          uid="$(docker run --rm --entrypoint id app:ci -u)"
          echo "Benutzer-ID im Image: $uid"
          test "$uid" != "0"
      - name: docker compose up
        run: docker compose up -d --build
      - name: /healthz antwortet innerhalb von 60 Sekunden mit 200
        run: |
          for second in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)" = "200" ]; then
              echo "/healthz: 200 nach $second Sekunden"
              exit 0
            fi
            sleep 1
          done
          echo "/healthz hat nach 60 Sekunden nicht mit 200 geantwortet"
          exit 1
      - name: Laufender Container ist nicht root
        run: |
          uid="$(docker compose exec -T app id -u)"
          echo "Benutzer-ID im Container: $uid"
          test "$uid" != "0"
      - name: Migrationen sind gelaufen (Tabelle users)
        run: |
          exists="$(docker compose exec -T db psql -U app -d app -tAc "select to_regclass('public.users') is not null")"
          echo "Tabelle users vorhanden: $exists"
          test "$exists" = "t"
      - name: Anmeldung mit dem Admin aus der Umgebung
        run: |
          body="$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email: $email, password: $password}')"
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' --data "$body")"
          echo "POST /api/auth/login: $status"
          test "$status" = "200"
      - name: bun run seed im Container
        run: |
          docker compose exec -T app bun run seed
          count="$(docker compose exec -T db psql -U app -d app -tAc "select count(*) from tasks")"
          echo "Aufgaben nach dem Seed: $count"
          test "$count" = "30"
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs
      - name: Aufräumen
        if: always()
        run: docker compose down -v
